<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Score</title>
<link rel="stylesheet" href="css/rsbv.css">
</head>
<body>
<main>
  <h1>Recall Score</h1>
  <p id="status"></p>
  <div id="error" role="alert" tabindex="-1" hidden></div>
  <div id="drop-zone">
    <label for="file-input">Open a score (MusicXML, .xml or .mxl), or drop one here</label>
    <input id="file-input" type="file" accept=".musicxml,.xml,.mxl">
  </div>
  <h2>Score</h2>
  <ul id="summary" tabindex="-1"></ul>
</main>
<div class="visually-hidden" aria-live="polite" id="live-a"></div>
<div class="visually-hidden" aria-live="polite" id="live-b"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
