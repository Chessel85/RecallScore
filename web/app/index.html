<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Score</title>
<link rel="stylesheet" href="css/rsbv.css">
</head>
<body>
<main>
  <h1>Recall Score</h1>
  <p id="status"></p>
  <div id="error" role="alert" tabindex="-1" hidden></div>
  <div id="drop-zone">
    <label for="file-input">Open a score (MusicXML, MIDI or Guitar Pro), or drop one here</label>
    <input id="file-input" type="file" accept=".musicxml,.xml,.mxl,.mid,.midi,.gp">
  </div>
  <!-- The region cycle (focus.js): Menu, then Regions 1 to 6. The regions
       stay in number order in the document, so browse mode reads them in
       order; the grid places them in two rows of three, 1 2 6 over 3 4 5. -->
  <button id="menu-button" type="button">Menu</button>
  <div id="regions">
    <section class="region" id="box-1">
      <h2 id="label-1">Score information</h2>
      <div id="region-1" role="listbox" aria-labelledby="label-1"></div>
    </section>
    <section class="region" id="box-2">
      <h2 id="label-2">Parts</h2>
      <div id="region-2" role="tree" aria-labelledby="label-2"></div>
    </section>
    <section class="region" id="box-3">
      <h2 id="label-3">Notes</h2>
      <div id="region-3" role="listbox" aria-labelledby="label-3" aria-multiselectable="true"></div>
    </section>
    <section class="region" id="box-4">
      <h2 id="label-4">Attributes</h2>
      <div id="region-4" role="listbox" aria-labelledby="label-4"></div>
    </section>
    <section class="region" id="box-5">
      <h2 id="label-5">Performance information</h2>
      <div id="region-5" role="listbox" aria-labelledby="label-5"></div>
    </section>
    <section class="region" id="box-6">
      <h2 id="label-6">Status</h2>
      <div id="region-6" role="listbox" aria-labelledby="label-6"></div>
    </section>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
